<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e7e0"><meta name="description" content="小暖，一座浏览器里的壁炉。">
  <title>小暖 · 壁炉</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script>
</head>
<body data-skin="nordic">
  <header class="site-header"><a class="brand" href="./" aria-label="小暖首页"><img src="./icon.svg" alt="小暖" width="28" height="28">小暖</a><div class="header-actions"><div class="skins" aria-label="展示皮肤"><button data-skin="nordic" aria-pressed="true">壁炉</button><button data-skin="retro" aria-pressed="false">暖炉</button></div></div></header>
  <main>
    <section class="room" aria-label="暖炉展示">
      <div class="window-light" aria-hidden="true"></div><div class="floor" aria-hidden="true"></div>
      <div id="heater" class="heater" data-on="false" data-mode="gentle">
        <div class="fireplace" aria-hidden="true">
          <div class="chimney"></div><div class="stove-top"></div>
          <div class="stove-body"><div class="door-frame"><div class="firebox"><div class="firelight"></div>
            <svg class="fire" viewBox="0 0 300 310" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="flame" x1="0" y1="1" x2=".1" y2="0"><stop stop-color="#fff3ba"/><stop offset=".3" stop-color="#ffd16f"/><stop offset=".65" stop-color="#ec7930"/><stop offset="1" stop-color="#d54a1c" stop-opacity=".15"/></linearGradient><linearGradient id="hot" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#fff5c8"/><stop offset=".55" stop-color="#ffbf5b"/><stop offset="1" stop-color="#fb9d3b" stop-opacity=".25"/></linearGradient><radialGradient id="ember"><stop stop-color="#ffb353"/><stop offset="1" stop-color="#ad3820" stop-opacity="0"/></radialGradient></defs>
              <ellipse cx="150" cy="273" rx="125" ry="28" fill="url(#ember)"/>
              <g class="flames"><path class="tongue t1" fill="url(#flame)" d="M44 270C9 233 62 196 47 154C81 169 67 202 83 212C105 176 78 135 110 100C105 155 147 169 127 218C113 266 99 284 44 270Z"/><path class="tongue t2" fill="url(#flame)" d="M100 278C58 232 132 182 113 141C143 170 153 128 139 77C184 107 145 149 175 170C182 132 216 109 202 62C247 126 188 171 220 210C244 255 199 292 100 278Z"/><path class="tongue t3" fill="url(#flame)" d="M187 274C166 232 230 204 224 167C238 193 259 164 254 136C291 175 250 205 265 232C279 264 234 285 187 274Z"/><path class="tongue t4" fill="url(#hot)" d="M91 278C68 246 122 216 113 183C147 215 121 225 141 242C152 204 183 204 175 160C210 191 176 226 201 245C224 281 130 298 91 278Z"/><path class="tongue t5" fill="url(#hot)" d="M156 284C130 253 174 241 167 215C201 232 182 253 205 269C217 286 183 291 156 284Z"/></g>
              <g class="logs"><g transform="rotate(-13 145 270)"><rect x="40" y="252" width="208" height="31" rx="14" fill="#38261e"/><path d="M58 259L228 260M70 271L223 276M91 256L99 282M174 254L183 280" stroke="#7d4a2e" stroke-width="3"/><ellipse cx="241" cy="267" rx="15" ry="16" fill="#785039"/><ellipse cx="241" cy="267" rx="8" ry="10" fill="none" stroke="#442f22" stroke-width="2"/></g><g transform="rotate(15 150 280)"><rect x="68" y="266" width="168" height="26" rx="12" fill="#241e19"/><path d="M82 274L218 274M104 286L204 285M151 268L156 288" stroke="#62412b" stroke-width="3"/></g></g>
              <g class="sparks" fill="#ffd989"><circle class="spark s1" cx="103" cy="190" r="1.5"/><circle class="spark s2" cx="187" cy="215" r="1"/><circle class="spark s3" cx="152" cy="162" r="1.3"/></g>
            </svg><div class="glass-shine"></div></div></div><div class="door-handle"></div><div class="air-vent"><i></i><i></i><i></i></div><div class="stove-mark">小暖</div></div>
          <div class="stove-base"><div class="stored-log log-a"></div><div class="stored-log log-b"></div><div class="stored-log log-c"></div></div><div class="stove-feet"><i></i><i></i></div>
        </div>
        <div class="retro-heater" aria-hidden="true"><div class="retro-handle"></div><div class="retro-shell"><span class="retro-brand">小暖</span><div class="grill"><div class="reflector"></div><div class="coils"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="grill-mesh"></div></div><div class="retro-vents"></div><div class="retro-pilot"></div><svg class="retro-relay" viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="relay-metal"><stop stop-color="#aa9c7d"/><stop offset=".5" stop-color="#f1e5c9"/><stop offset="1" stop-color="#8d7b5b"/></linearGradient><linearGradient id="relay-body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#655841"/><stop offset=".35" stop-color="#3b3428"/><stop offset="1" stop-color="#181914"/></linearGradient></defs><circle cx="18" cy="18" r="17" fill="#8d7b5c"/><circle cx="18" cy="18" r="16" fill="url(#relay-metal)"/><circle cx="18" cy="18" r="14" fill="#302b21"/><g class="relay-knob"><circle cx="18" cy="18" r="12.5" fill="url(#relay-body)" stroke="#a49473" stroke-width=".6"/><path d="M9 15Q18 10 27 15L26 21Q18 25 10 21Z" fill="#64583f" stroke="#8d7c58" stroke-width=".5"/><path d="M18 7V11" stroke="#d8c9a2" stroke-width="1.6" stroke-linecap="round"/></g></svg></div><div class="retro-feet"><i></i><i></i></div></div>

        <canvas class="shutdown-atmosphere" width="330" height="510" aria-hidden="true"></canvas>
        <svg class="shutdown-scene" viewBox="0 0 330 510" aria-hidden="true">
          <defs>
            <linearGradient id="vessel-body"><stop stop-color="#28372f"/><stop offset=".13" stop-color="#7b8e7d"/><stop offset=".30" stop-color="#bec5ad"/><stop offset=".49" stop-color="#899a83"/><stop offset=".75" stop-color="#435a48"/><stop offset=".94" stop-color="#657d62"/><stop offset="1" stop-color="#2b4235"/></linearGradient>
            <linearGradient id="vessel-rim" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ecedd4"/><stop offset=".28" stop-color="#a9b89d"/><stop offset=".65" stop-color="#506c56"/><stop offset="1" stop-color="#293e31"/></linearGradient>
            <linearGradient id="vessel-spout" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d2d9be"/><stop offset=".24" stop-color="#9eaf92"/><stop offset=".55" stop-color="#6b8469"/><stop offset=".85" stop-color="#314f3d"/><stop offset="1" stop-color="#1c3327"/></linearGradient>
            <linearGradient id="vessel-handle"><stop stop-color="#243c2d"/><stop offset=".4" stop-color="#97aa8a"/><stop offset=".7" stop-color="#5d795c"/><stop offset="1" stop-color="#2a4430"/></linearGradient>
            <radialGradient id="vessel-bounce" cx=".38" cy="1" r=".8"><stop stop-color="#f7b66b" stop-opacity=".42"/><stop offset=".5" stop-color="#c39a5a" stop-opacity=".1"/><stop offset="1" stop-color="#33442d" stop-opacity="0"/></radialGradient>
            <clipPath id="vessel-clip"><path d="M233 149Q264 157 296 149L300 186Q301 201 266 204Q231 202 228 190Z"/></clipPath>
          </defs>
          <g class="can-motion">
            <path d="M291 155C323 128 331 184 298 188" fill="none" stroke="#1f3327" stroke-width="10"/>
            <path d="M291 154C321 131 327 183 298 185" fill="none" stroke="url(#vessel-handle)" stroke-width="6.5"/>
            <path d="M299 150C312 146 317 153 318 163" fill="none" stroke="#d5dec0" stroke-width=".9" opacity=".62"/>
            <path d="M240 166C228 166 220 161 211 146L201 151C211 172 223 181 238 185Z" fill="url(#vessel-spout)" stroke="#324f3a" stroke-width=".65"/>
            <path d="M239 169C222 169 213 158 208 151" fill="none" stroke="#e2e5c9" stroke-width="1.1" opacity=".75"/>
            <ellipse cx="204" cy="150" rx="4.6" ry="7" transform="rotate(-48 204 150)" fill="#c2d2b3"/>
            <ellipse cx="204" cy="150" rx="2.9" ry="5.4" transform="rotate(-48 204 150)" fill="#20392e"/>
            <ellipse cx="266" cy="192" rx="34" ry="11" fill="#1c3025"/>
            <path d="M233 149Q264 157 296 149L300 186Q301 201 266 204Q231 202 228 190Z" fill="url(#vessel-body)" stroke="#334e37" stroke-width=".65"/>
            <g clip-path="url(#vessel-clip)"><rect x="225" y="153" width="82" height="55" fill="url(#vessel-bounce)"/>
              <path d="M243 155L239 194M246 156L243 197M249 156L247 199M252 157L250 200M256 158L255 201M260 159L260 202" stroke="#ebeed5" stroke-width=".45" opacity=".12"/>
              <ellipse cx="247" cy="172" rx="8" ry="31" fill="#e0e6cb" opacity=".07"/>
            </g>
            <path d="M231 186Q263 205 299 187" fill="none" stroke="#c6ceb0" stroke-width=".75" opacity=".64"/>
            <path d="M234 195Q264 208 295 196" fill="none" stroke="#182f22" stroke-width="1.2"/>
            <ellipse cx="264" cy="149" rx="32" ry="10" fill="url(#vessel-rim)" stroke="#b7c3a2" stroke-width=".8"/>
            <ellipse cx="264" cy="149" rx="27" ry="6.5" fill="#243e32"/>
            <ellipse cx="264" cy="150" rx="24" ry="4.3" fill="#687f6a"/>
            <path d="M237 145Q264 136 291 145" fill="none" stroke="#f0eed3" stroke-width=".8" opacity=".8"/>
            <path d="M245 141Q253 119 275 140" fill="none" stroke="#243d2c" stroke-width="6"/>
            <path d="M245 139Q255 119 275 138" fill="none" stroke="url(#vessel-rim)" stroke-width="3.8"/>
            <circle cx="236" cy="170" r="1.6" fill="#a9b997"/><circle cx="294" cy="165" r="1.5" fill="#a9b997"/>
          </g>
        </svg>
      </div><div class="ground-glow" aria-hidden="true"></div>
    </section>
    <section class="controls" aria-label="壁炉控制">
      <div class="control-main"><button id="power" class="power" aria-label="点火" aria-pressed="false"><svg class="power-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.4 5.9a8 8 0 1 0 11.2 0"/></svg><svg class="stop-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button><div id="modes" class="modes" aria-label="暖意档位"><button data-mode="gentle" aria-pressed="true">轻柔</button><button data-mode="cozy" aria-pressed="false">温暖</button><button data-mode="toasty" aria-pressed="false">热烈</button></div><div class="timer-readout"><span id="state-dot" class="state-dot"></span><div role="timer" aria-label="剩余时间" id="countdown">01:00</div></div></div>
      <div class="control-settings"><div id="durations" class="durations" aria-label="定时"><button data-minutes="1" aria-pressed="true" aria-label="1 分钟">1′</button><button data-minutes="3" aria-pressed="false" aria-label="3 分钟">3′</button><button data-minutes="5" aria-pressed="false" aria-label="5 分钟">5′</button></div><div class="source-settings"><div class="sources" aria-label="计算设备"><label class="source"><input type="checkbox" id="cpu" checked><span><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2"/><path d="M7 1v3m6-3v3M7 16v3m6-3v3M1 7h3m-3 6h3m12-6h3m-3 6h3"/></svg>CPU<i></i></span></label><label class="source"><input type="checkbox" id="gpu"><span><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="5" width="16" height="10" rx="2"/><circle cx="10" cy="10" r="3"/><path d="M5 15v3m4-3v3"/></svg>GPU<i></i></span></label></div></div></div>
      <div class="telemetry" aria-label="实时计算状态">
        <div class="compute-readout" id="cpu-readout" data-status="stopped"><div class="readout-heading"><span class="readout-label">CPU<small class="compute-target" id="cpu-target">目标 40%</small></span><span class="compute-status" id="cpu-status" role="status">已停止</span></div><div class="compute-value" id="cpu-value">—</div><div class="compute-metric" id="cpu-metric"></div></div>
        <div class="compute-readout" id="gpu-readout" data-status="disabled"><div class="readout-heading"><span class="readout-label">GPU<small class="compute-target" id="gpu-target">目标 35%</small></span><span class="compute-status" id="gpu-status" role="status">已关闭</span></div><div class="compute-value" id="gpu-value">—</div><div class="compute-metric" id="gpu-metric"></div></div>
      </div>
    </section>
  </main>
  <noscript><p class="noscript">请启用 JavaScript。</p></noscript>
</body>
</html>
